spring:
  application:
    name: "configserver"
  profiles:
    #active: native  #only for local
    active: git

  cloud:
    config:
      server:
        #native:
          #search-locations: classpath:/config
        git:
          uri: https://github.com/nishantsnaik/vybercoders-config.git
          default-label: main
          timeout: 5
          clone-on-start: true
          force-pull: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
    endpoint:
      health:
        probes:
          enabled: true

encrypt:
