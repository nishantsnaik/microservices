spring:
  application:
    name: "gatewayserver"
  config:
    import: "optional:configserver:http://localhost:8071"
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lowerCaseServiceId: true
          httpclient:
            connect-timeout: 1000
            response-timeout: 2s
  data:
    redis:
      connect-timeout: 2s
      host: localhost
      port: 6379
      timeout: 1s

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: "gatewayserver"
    description: "Microservice for gateway server"
    version: "1.0.0"

logging:
  level:
    com:
      vybercoders:
        gatewayserver: DEBUG

resilience4j.circuitbreaker:
  configs:
    ## can update the default below to accountsCircuitBreaker is we want to make if specific
    ## ex:
    ## accountsCircuitBreaker:
    ##   slidingWindowSize: 10
    ##   permittedNumberOfCallsInHalfOpenState: 2
    ##   failureRateThreshold: 50
    ##   waitDurationInOpenState: 10000
    default:
      slidingWindowSize: 10
      permittedNumberOfCallsInHalfOpenState: 2
      failureRateThreshold: 50
      waitDurationInOpenState: 10000